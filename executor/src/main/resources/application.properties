spring.application.name=executor
executor.id=executor-1
server.port=7070
spring.grpc.server.port=6564
spring.data.mongodb.uri=mongodb://localhost:27017/executor_logs
spring.datasource.url=jdbc:postgresql://localhost:5432/krite
spring.datasource.username=postgres
spring.grpc.client.channels.local.address=localhost:6565
spring.grpc.client.channels.local.negotiation-type=plaintext

rustfs.url=${RUSTFS_URL:http://127.0.0.1:9000}
rustfs.region=${RUSTFS_REGION:us-east-1}
rustfs.access-key=${RUSTFS_ACCESS_KEY:rustfsadmin}
rustfs.secret-key=${RUSTFS_SECRET_KEY:fc011b5e757cf26aaa5d83a303ebba263527fdc4f4a649a9febbc08bda34d19a}
rustfs.bucket=${RUSTFS_BUCKET:krite}

spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Optional connection pool (HikariCP is default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CoordinatorHikariCP
spring.datasource.hikari.max-lifetime=1800000
# Whisper defaults are in common/src/main/resources/transcription.properties.
# Override krite.transcription.* here; keep model/subtitle policy identical on all nodes.
