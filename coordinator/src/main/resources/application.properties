spring.application.name=coordinator
server.port=8080
spring.grpc.server.port=6565
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/krite
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.devtools.restart.enabled=false


# RustFS
rustfs.url=${RUSTFS_URL:http://127.0.0.1:9000}
rustfs.region=${RUSTFS_REGION:us-east-1}
rustfs.access-key=${RUSTFS_ACCESS_KEY:rustfsadmin}
rustfs.secret-key=${RUSTFS_SECRET_KEY:fc011b5e757cf26aaa5d83a303ebba263527fdc4f4a649a9febbc08bda34d19a}
rustfs.bucket=${RUSTFS_BUCKET:krite}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CoordinatorHikariCP
spring.datasource.hikari.max-lifetime=1800000
