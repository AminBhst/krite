# Shared defaults. Override these properties in API/executor application.properties or environment.
# Keep models and subtitles-enabled identical on the API and every executor.
krite.transcription.models=${KRITE_TRANSCRIPTION_MODELS:base}
krite.transcription.subtitles-enabled=${KRITE_TRANSCRIPTION_SUBTITLES_ENABLED:false}
krite.transcription.whisper-executable=${KRITE_WHISPER_EXECUTABLE:whisper}
krite.transcription.ffmpeg-executable=${KRITE_FFMPEG_EXECUTABLE:ffmpeg}
krite.transcription.ffprobe-executable=${KRITE_FFPROBE_EXECUTABLE:ffprobe}
krite.transcription.device=${KRITE_WHISPER_DEVICE:cpu}
krite.transcription.process-timeout=${KRITE_TRANSCRIPTION_PROCESS_TIMEOUT:2h}
